  url: '{{baseUrl}}/api/orders/does-not-exist-xyz'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "error": "Order not found"
      }
