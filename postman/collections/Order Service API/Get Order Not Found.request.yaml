$kind: http-request
method: GET
url: '{{baseUrl}}/api/orders/does-not-exist-xyz'
order: 7000
headers:
  - key: x-mock-session
    value: "{{mockSessionId}}"
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status code is 404', function () {
        pm.response.to.have.status(404);
      });

      pm.test('body reports order not found', function () {
        const body = pm.response.json();
        pm.expect(body.error).to.eql('Order not found');
      });
examples: './.resources/Get Order Not Found.resources/examples'
