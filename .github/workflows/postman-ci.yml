name: Postman CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  postman-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install service dependencies
        run: npm ci
      - name: Install Postman CLI
        run: npm install -g postman-cli
      - name: Authenticate Postman CLI
        run: postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"
      - name: Start service in background
        run: nohup npm start > server.log 2>&1 &
      - name: Wait for service to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4003/health && exit 0
            sleep 1
          done
          echo "Service never became healthy"; cat server.log; exit 1
      - name: Spec lint (governance)
        run: postman spec lint postman/specs/order-service/index.yaml --workspace-id 7548ccb1-0053-4ca9-8b8d-569896793e98 -f error
      - name: Collection lint (structure/style)
        run: postman collection lint "postman/collections/Order Service API" -f error
      - name: Collection run (live contract test)
        run: postman collection run "postman/collections/Order Service API" -e postman/environments/order-service-local.environment.yaml
      - name: Contract test against deployed mock (publisher-driven)
        # Deployed mocks run multiple non-sticky instances with no shared
        # memory (confirmed separately), so the full create-then-look-up
        # flow flakes against them through no fault of the mock's
        # contract. Scoped to the self-contained negative test instead: a
        # single request with no cross-request state dependency, so it's
        # a reliable gate that a bad body still gets rejected by whatever
        # is actually deployed, not just by the local mock.
        run: postman collection run "postman/collections/Order Service API" -e postman/environments/order-service-mock.environment.yaml --env-var "mockSessionId=ci-${{ github.run_id }}-${{ github.run_attempt }}" -i "Create Order Rejects Unexpected Field (negative)"
      - name: AI readiness gate (spec)
        run: postman spec ai-readiness postman/specs/order-service/index.yaml --min-score 70
      - name: AI readiness gate (collection)
        run: postman collection ai-readiness "postman/collections/Order Service API" --min-score 70
      - name: Push to Postman workspace (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: postman workspace push -y
